<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Thank You | Thomas Walter Dolon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#080a0d;--dark:#0d1117;--red:#c0392b;--red2:#e74c3c;--text:#e6e9ef;--text2:#98aab8;--text3:#5a6e7e}
html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--black);color:var(--text);overflow:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
.scanline{position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.03) 3px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:0}
.accent-line{position:fixed;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--red),transparent);z-index:1}
.wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}

/* ICON */
.check-wrap{width:80px;height:80px;border:2px solid var(--red);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;margin:0 auto 2.5rem;opacity:0;animation:popIn 0.6s 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards}
.check-wrap svg{transform:rotate(-45deg);width:36px;height:36px}
@keyframes popIn{from{opacity:0;transform:rotate(45deg) scale(0.5)}to{opacity:1;transform:rotate(45deg) scale(1)}}

/* TEXT */
.eyebrow{font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--red2);letter-spacing:3px;text-transform:uppercase;margin-bottom:1rem;opacity:0;animation:fadeUp 0.6s 0.6s forwards}
.eyebrow::before{content:'// '}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,8vw,6rem);letter-spacing:4px;color:#fff;line-height:0.95;margin-bottom:1rem;opacity:0;animation:fadeUp 0.6s 0.8s forwards}
h1 span{color:var(--red2)}
.subtitle{font-size:1rem;color:var(--text2);font-weight:300;line-height:1.8;max-width:480px;margin:0 auto 2.5rem;opacity:0;animation:fadeUp 0.6s 1s forwards}
.divider{width:48px;height:1px;background:var(--red);margin:0 auto 2.5rem;opacity:0;animation:fadeUp 0.6s 0.9s forwards}

/* WHAT'S NEXT */
.next-steps{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-bottom:3rem;opacity:0;animation:fadeUp 0.6s 1.1s forwards}
.step{background:rgba(192,57,43,0.06);border:1px solid rgba(192,57,43,0.2);padding:0.75rem 1.25rem;display:flex;align-items:center;gap:0.75rem;font-family:'Barlow Condensed',sans-serif;font-size:0.82rem;letter-spacing:1px;color:var(--text2);text-transform:uppercase}
.step-num{font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:var(--red2)}

/* BUTTONS */
.btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeUp 0.6s 1.3s forwards}
.btn-primary{background:var(--red);color:#fff;padding:0.85rem 2rem;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:0.88rem;letter-spacing:2px;text-transform:uppercase;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:background 0.2s}
.btn-primary:hover{background:var(--red2)}
.btn-ghost{border:1px solid rgba(255,255,255,0.1);color:var(--text2);padding:0.85rem 2rem;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:0.88rem;letter-spacing:2px;text-transform:uppercase;transition:all 0.2s}
.btn-ghost:hover{border-color:var(--red);color:var(--red2)}

/* LOGO */
.logo{position:fixed;top:1.5rem;left:2rem;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:4px;color:rgba(255,255,255,0.4);z-index:2;text-decoration:none}
.logo span{color:var(--red2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* TYPE DETECTION */
.msg-inquiry,.msg-booking{display:none}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="accent-line"></div>
<a href="index.html" class="logo"><img src="https://raw.githubusercontent.com/thomdolon-hue/thomas-walter-dolon-portfolio/main/images/MyLogo.png" alt="TWD Logo" style="height:32px;object-fit:contain"/></a>

<div class="wrap">
  <div class="check-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <p class="eyebrow" id="eyebrow">Confirmed</p>
  <h1 id="heading">THANK <span>YOU!</span></h1>
  <div class="divider"></div>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div class="next-steps" id="next-steps"></div>

  <div class="btns">
    <a href="index.html" class="btn-primary">Back to Portfolio</a>
    <a href="https://www.linkedin.com/in/thomas-walter-dolon" target="_blank" class="btn-ghost">Connect on LinkedIn</a>
  </div>
</div>

<script>
// Detect type from URL param: ?type=inquiry or ?type=booking
const params = new URLSearchParams(window.location.search);
const type = params.get('type') || 'inquiry';

const heading = document.getElementById('heading');
const subtitle = document.getElementById('subtitle');
const eyebrow = document.getElementById('eyebrow');
const nextSteps = document.getElementById('next-steps');

if(type === 'booking'){
  eyebrow.textContent = 'Booking Confirmed';
  heading.innerHTML = 'SEE YOU <span>SOON!</span>';
  subtitle.textContent = "Your discovery call has been scheduled. I'll reach out with a confirmation and any prep details. Looking forward to speaking with you!";
  nextSteps.innerHTML = `
    <div class="step"><span class="step-num">01</span> Check your email for the calendar invite</div>
    <div class="step"><span class="step-num">02</span> Prepare a brief on your compliance needs</div>
    <div class="step"><span class="step-num">03</span> Join the call at the scheduled time</div>
  `;
} else {
  eyebrow.textContent = 'Message Received';
  heading.innerHTML = 'THANK <span>YOU!</span>';
  subtitle.textContent = "Your inquiry has been received. I'll review your message and get back to you within 24–48 hours. In the meantime, feel free to connect with me on LinkedIn.";
  nextSteps.innerHTML = `
    <div class="step"><span class="step-num">01</span> Check your inbox for a confirmation</div>
    <div class="step"><span class="step-num">02</span> I'll respond within 24–48 hours</div>
    <div class="step"><span class="step-num">03</span> We'll schedule a discovery call</div>
  `;
}
</script>
</body>
</html>
